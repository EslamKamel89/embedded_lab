services:
  renode:
    image: antmicro/renode:latest
    platform: linux/amd64
    container_name: stm32-renode
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - ./renode/scripts:/workspace/scripts
      - ./firmware:/workspace/firmware
    working_dir: /workspace
    command:
      - renode
      - --disable-gui
      - --hide-log
      - -P
      - "1234"
